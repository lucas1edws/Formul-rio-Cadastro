<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta</title>

    <link rel="stylesheet" href="form.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <script src="./form.js" defer></script>
</head>

<body>
    <form id="formulario" novalidate>
        <h2>Criar conta</h2>

        <div class="campos">

            <div class="campo">
                <i class="bi bi-person"></i>
                <label for="primeiroNome">Primeiro nome:</label>
                <input type="text" id="primeiroNome" name="nome" placeholder="Digite seu nome" required>

                <span class="erro"></span>

            </div>

            <div class="campo">
                <i class="bi bi-person"></i>
                <label for="ultimoNome">Último nome:</label>
                <input type="text" id="ultimoNome" name="ultimo_nome" placeholder="Digite seu sobrenome" required>

                <span class="erro"></span>

            </div>

            <div class="campo">
                <i class="bi bi-calendar"></i>
                <label for="nascimento">Data de nascimento:</label>
                <input type="text" id="nascimento" name="nascimento" placeholder="DD/MM/AAAA" maxlength="10" required>

                <span class="erro"></span>

            </div>

            <div class="campo">
                <i class="bi bi-envelope"></i>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Digite seu email" required>

                <span class="erro"></span>

            </div>

            <div class="campo">
                <i class="bi bi-shield-lock"></i>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>
                <button type="button" class="alternar-senha" aria-label="Mostrar senha">
                    <i class="bi bi-eye"></i>
                </button>

                <span class="erro"></span>

            </div>

            <div class="campo">
                <i class="bi bi-shield-lock"></i>
                <label for="informar senha">Informar senha:</label>
                <input type="password" id="informar senha" name="confirmar_senha" placeholder="Repita sua senha"
                    required>
                <button type="button" class="alternar-senha" aria-label="Mostrar senha">
                    <i class="bi bi-eye"></i>
                </button>

                <span class="erro"></span>

                <span id="mensagemErro" role="alert" aria-live="polite"></span>

            </div>

            <fieldset class="genero">
                <legend>Gênero:</legend>
                <label for="masculino">Masculino</label>
                <input type="radio" id="masculino" name="genero" required>

                <label for="feminino">Feminino</label>
                <input type="radio" id="feminino" name="genero" required>

                <label for="outro">Outro</label>
                <input type="radio" id="outro" name="genero" required>
            </fieldset>

        <span id="erroGenero" class="erro" role="alert" aria-live="polite"></span>

        </div>

        <button type="submit">Criar conta</button>
    </form>

    <div id="sucesso" style="display: none;" role="status" aria-live="polite">
        <i class="bi bi-check-circle-fill"></i>
        <h2>Conta criada com sucesso!</h2>
        <p>Seu cadastro foi concluído.</p>
    </div>

</body>

</html>
